name: Trigger COPR Build

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - "apps/**/*.spec"

permissions:
  contents: read

jobs:
  # --- JOB 1: PRE-FLIGHT UPDATE DETECTOR ---
  detect-updates:
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.check.outputs.matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect Updates Across All Apps
        id: check
        run: python3 scripts/check_updates.py

  # --- JOB 2: DYNAMIC BUILD MATRIX (ONLY RUNS FOR OUTDATED APPS) ---
  build-updates:
    needs: detect-updates
    if: ${{ needs.detect-updates.outputs.matrix != '[]' && needs.detect-updates.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      COLOR_INFO: "\e[1;36m"
      COLOR_SUCCESS: "\e[1;32m"
      COLOR_WARN: "\e[1;33m"
      COLOR_RESET: "\e[0m"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-updates.outputs.matrix) }}
    steps:
      - name: Checkout Subdirectory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            apps/${{ matrix.app_name }}
            scripts/changelog_scraper.py

      - name: Bump Version in Spec File
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROVIDER: "${{ matrix.provider }}"
          REPO: "${{ matrix.upstream_repo }}"
          INSTANCE: "${{ matrix.instance }}"
          APP: ${{ matrix.app_name }}
          SPEC: "apps/${{ matrix.app_name }}/${{ matrix.app_name }}.spec"
          OLD_VER: ${{ matrix.old_ver }}
          NEW_VER: ${{ matrix.raw_new_ver }}
          CLEAN_NEW_VER: ${{ matrix.new_ver }}
        run: |
          if [[ ! -f "$SPEC" ]]; then
            echo "::error::==> [ERROR] $SPEC not found!"
            exit 1
          fi

          echo -e "${COLOR_INFO}==> [INFO] Bumping $APP from $OLD_VER to $CLEAN_NEW_VER...${COLOR_RESET}"
          sed -i "s/^Version:.*/Version:        $CLEAN_NEW_VER/" "$SPEC"

          # Update external sources for apps that require bundled dependencies
          case "$APP" in
            sudoku)
              FILE_PATH="python3-requirements.json"
              KEYWORDS="sudoku_engine"
              ;;
            calligraphy)
              FILE_PATH="build-aux/dev.geopjr.Calligraphy.Devel.json"
              KEYWORDS="pyfiglet"
              ;;
            *)
              FILE_PATH=""
              KEYWORDS=""
              ;;
          esac

          if [[ -n "$FILE_PATH" && -n "$KEYWORDS" ]]; then
            python3 scripts/source_scraper.py "$PROVIDER" "$INSTANCE" "$REPO" "$NEW_VER" "$SPEC" "$FILE_PATH" $KEYWORDS
          fi

          APP_ID=$(grep -E '^\s*%global\s+(app_id|rdnn)\s+' "$SPEC" | awk '{print $3}')
          CHANGELOG=$(python3 scripts/changelog_scraper.py get-changelog "$PROVIDER" "$INSTANCE" "$REPO" "$APP_ID" "$NEW_VER")

          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          DATE=$(date +"%a %b %d %Y")
          AUTHOR="Infiniti151 <43163551+Infiniti151@users.noreply.github.com>"
          echo "* $DATE $AUTHOR - $NEW_VER-1" > entry.tmp
          echo "$CHANGELOG" | sed 's/%/%%/g' >> entry.tmp
          echo "" >> entry.tmp

          if grep -q "^%changelog" "$SPEC"; then
            sed -i "/^%changelog/r entry.tmp" "$SPEC"
          else
            sed -i -e :a -e '/^\n*$/{$d;N;ba' -e '}' "$SPEC"

            echo -e "\n\n%changelog" >> "$SPEC"
            cat entry.tmp >> "$SPEC"
          fi

          rm entry.tmp

      - name: Auto-Commit and Push Verified Bot Commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP: ${{ matrix.app_name }}
          SPEC: "apps/${{ matrix.app_name }}/${{ matrix.app_name }}.spec"
          NEW_VER: ${{ matrix.raw_new_ver }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$SPEC"
          git commit -m "chore($APP): bump spec version to $NEW_VER [skip ci]" || { echo -e "${COLOR_WARN}==> [WARNING] No changes to commit. Skipping push.${COLOR_RESET}"; exit 0; }

          # Retry loop to handle concurrent matrix push collisions
          for i in {1..10}; do
            git pull --rebase origin main

            if git push origin main; then
              echo -e "${COLOR_SUCCESS}==> [SUCCESS] Pushed verified bot commit successfully!${COLOR_RESET}"
              exit 0
            fi

            echo -e "${COLOR_WARN}==> [WARNING] Push rejected by remote. Retrying in a few seconds...${COLOR_RESET}"
            sleep $((RANDOM % 6 + 2))
          done

          echo "::error::==> [ERROR] Failed to push after 10 attempts."
          exit 1

      - name: Trigger COPR Build
        env:
          APP: ${{ matrix.app_name }}
          OLD_VER: ${{ matrix.old_ver }}
          NEW_VER: ${{ matrix.new_ver }}
          COPR_URL: ${{ secrets.COPR_BASE_WEBHOOK_URL }}
        run: |
          BASE_URL=$(echo "$COPR_URL" | xargs)
          FINAL_URL="${BASE_URL%/}/$APP/"

          echo -e "${COLOR_INFO}==> [INFO] Triggering COPR build...${COLOR_RESET}"

          if BUILD_ID=$(curl -fsS -X POST "$FINAL_URL" | tr -d '\n'); then
            echo "Build ID: $BUILD_ID"
            mkdir -p copr-builds
            echo "${APP}|${OLD_VER}|${NEW_VER}|${BUILD_ID}" > "copr-builds/${APP}.txt"
            echo -e "${COLOR_SUCCESS}==> [SUCCESS] Triggered COPR build!${COLOR_RESET}"
          else
            echo "::error::==> [ERROR] Webhook failed to trigger COPR build."
            exit 1
          fi

      - name: Upload COPR Build Metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: copr-build-${{ matrix.app_name }}
          path: copr-builds/*.txt

      - name: Add to Workflow Summary
        env:
          APP: ${{ matrix.app_name }}
          OLD_VER: ${{ matrix.old_ver }}
          NEW_VER: ${{ matrix.new_ver }}
          CHANGELOG: ${{ steps.update.outputs.changelog }}
        run: |
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ### 🚀 COPR Build Triggered
          **App:** $APP
          **Version:** $OLD_VER -> $NEW_VER
          **Changelog:**
          $CHANGELOG
          EOF

  # --- JOB 3: UPDATE README ---
  update-readme:
    needs: build-updates
    if: ${{ !cancelled() && needs.build-updates.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Sync Changed Spec Versions to README
        env:
          START_SHA: ${{ github.sha }}
        run: |
          if [ ! -f "README.md" ]; then
            echo "README.md not found, skipping sync."
            exit 0
          fi

          # Get spec files modified between workflow start ($START_SHA) and current HEAD
          CHANGED_SPECS=$(git diff --name-only "$START_SHA" HEAD -- 'apps/*/*.spec' 2>/dev/null || true)

          if [ -z "$CHANGED_SPECS" ]; then
            echo "No spec files modified in this workflow run. Skipping README update."
            exit 0
          fi

          # Extract unique app names from paths: apps/<app_name>/<app_name>.spec
          CHANGED_APPS=$(echo "$CHANGED_SPECS" | cut -d'/' -f2 | sort -u)

          echo "Found modified spec files in this run:"
          echo "$CHANGED_APPS"

          while IFS= read -r APP_NAME; do
            [ -n "$APP_NAME" ] || continue
            SPEC="apps/${APP_NAME}/${APP_NAME}.spec"

            if [ -f "$SPEC" ]; then
              VER=$(awk '/^Version:/ {print $2}' "$SPEC")
              if [ -n "$VER" ] && grep -q "| $APP_NAME " "README.md"; then
                echo "Updating README row for $APP_NAME -> $VER"
                sed -i "/| $APP_NAME[^|]*|/ s/| [0-9.]* |/| $VER |/" "README.md"
              fi
            fi
          done <<< "$CHANGED_APPS"

      - name: Auto-Commit README Changes
        uses: suzuki-shunsuke/commit-action@5eaa5ecce3ffe93d09a85b946dc5136e3713b1b7 # v1.1.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          branch: main
          commit_message: "chore: sync updated spec versions to README.md"
          files: "README.md"
          fail_on_self_push: false

  # --- JOB 4: MERGE COPR BUILD ARTIFACTS ---
  merge-copr-build-artifacts:
    needs: [build-updates, update-readme]
    if: ${{ !cancelled() && needs.build-updates.result != 'skipped' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download All COPR Build Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: copr-build-*
          merge-multiple: true

      - name: Merge Build Metadata
        run: |
          mkdir -p merged

          find artifacts -name '*.txt' -type f | sort > filelist.txt

          touch merged/copr-builds.txt

          while IFS= read -r FILE; do
            cat "$FILE" >> merged/copr-builds.txt
            echo >> merged/copr-builds.txt
          done < filelist.txt

          echo "Merged build metadata:"
          cat merged/copr-builds.txt

      - name: Upload Combined Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: copr-builds
          path: merged/copr-builds.txt
          retention-days: 7
