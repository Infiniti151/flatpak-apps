---
name: Trigger COPR Build
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - "**/*.spec"

jobs:
  check-and-build:
    if: |
      github.event_name == 'schedule' || 
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_name: text-compare
            upstream_repo: josephmawa/TextCompare
            provider: github
          - app_name: concessio
            upstream_repo: ronniedroid/concessio
            provider: github
          - app_name: missioncenter
            upstream_repo: mission-center-devs/mission-center
            provider: gitlab
          - app_name: extension-manager
            upstream_repo: mjakeman/extension-manager
            provider: github
          - app_name: pods
            upstream_repo: marhkb/pods
            provider: github
          - app_name: tomatillo
            upstream_repo: diegopvlk/Tomatillo
            provider: github
          - app_name: konbucase
            upstream_repo: ryonakano/konbucase
            provider: github

    steps:
      - name: Checkout Subdirectory
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sparse-checkout: |
            ${{ matrix.app_name }}
            README.md

      - name: Get Latest Upstream Tag
        id: upstream
        run: |
          if [ "${{ matrix.provider }}" = "github" ]; then
            TAG=$(curl -s "https://api.github.com/repos/${{ matrix.upstream_repo }}/tags" | jq -r '.[].name // empty' | grep -E '^[0-9]' | sort -V | tail -n 1)
          elif [ "${{ matrix.provider }}" = "gitlab" ]; then
            ENCODED=$(echo "${{ matrix.upstream_repo }}" | sed 's/\//%2F/g')
            TAG=$(curl -s "https://gitlab.com/api/v4/projects/${ENCODED}/repository/tags?order_by=version&sort=desc" | jq -r '.[0].name // empty')
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Error: Could not fetch tag for ${{ matrix.upstream_repo }}"
            exit 1
          fi
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Check and Trigger COPR Build
        env:
          APP: ${{ matrix.app_name }}
          NEW_VER: ${{ steps.upstream.outputs.version }}
        run: |
          SPEC="$APP/$APP.spec"
          README="README.md"

          if [ ! -f "$SPEC" ]; then
            echo -e "\e[1;31m==> [ERROR] $SPEC not found!\e[0m"
            exit 1
          fi

          OLD_VER=$(grep -m1 '^Version:' "$SPEC" | awk '{print $2}')

          if [ "$OLD_VER" != "$NEW_VER" ]; then
            echo -e "\e[1;36m==> Bumping $APP from $OLD_VER to $NEW_VER...\e[0m"

            sed -i "s/^Version:.*/Version:        $NEW_VER/" "$SPEC"

            if [ "$APP" = "konbucase" ]; then
                CHCASE_LATEST=$(curl -s "https://api.github.com/repos/ryonakano/chcase/tags" | jq -r '.[0].name')
                
                CHCASE_CURRENT=$(grep "Source1:" "$SPEC" | sed -n 's|.*/archive/\([^/]*\)/.*|\1|p')

                if [ "$CHCASE_LATEST" != "$CHCASE_CURRENT" ]; then
                    echo -e "\e[1;36m==> Updating chcase from $CHCASE_CURRENT to $CHCASE_LATEST...\e[0m"
                    sed -i "s|Source1:.*|Source1:        https://github.com/ryonakano/chcase/archive/$CHCASE_LATEST/chcase-$CHCASE_LATEST.tar.gz|" "$SPEC"
                else
                    echo -e "\e[1;32m==> chcase is already up to date ($CHCASE_LATEST).\e[0m"
                fi
            fi

            DATE=$(date +"%a %b %d %Y")
            AUTHOR="Infiniti151 <43163551+Infiniti151@users.noreply.github.com>"

            echo "* $DATE $AUTHOR - $NEW_VER-1" > entry.tmp
            echo "- Update to $NEW_VER" >> entry.tmp
            echo "" >> entry.tmp

            if grep -q "^%changelog" "$SPEC"; then
                sed -i "/^%changelog/r entry.tmp" "$SPEC"
            else
                sed -i -e :a -e '/^\n*$/{$d;N;ba' -e '}' "$SPEC"

                {
                    echo ""
                    echo "%changelog"
                    cat entry.tmp
                } >> "$SPEC"
            fi

            rm entry.tmp

            if [ -f "$README" ]; then
               sed -i "/| $APP[^|]*|/ s/| [0-9.]* |/| $NEW_VER |/" "$README"
            fi

            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$SPEC" "$README"
            git commit -m "chore($APP): bump version to $NEW_VER"
            MAX_RETRIES=5
            for i in $(seq 1 $MAX_RETRIES); do
              echo -e "\e[1;36m==> Push attempt $i...\e[0m"
              if git pull --rebase origin main && git push origin main; then
                echo -e "\e[1;32m==> Successfully pushed $APP update.\e[0m"
                break
              fi
              if [ $i -eq $MAX_RETRIES ]; then
                echo -e "\e[1;31m==> [ERROR] Failed to push after $MAX_RETRIES attempts.\e[0m"
                exit 1
              fi
              sleep $(( (RANDOM % 10) + 1 ))
            done

            BASE_URL=$(echo "${{ secrets.COPR_BASE_WEBHOOK_URL }}" | xargs)
            FINAL_URL="${BASE_URL%/}/$APP/"

            echo -e "\e[1;36m==> Triggering COPR for $APP...\e[0m"
            curl -fsS -X POST "$FINAL_URL" || echo -e "\e[1;33m==> [WARNING] Webhook might have failed, but push was successful.\e[0m"
          else
            echo -e "\e[1;32m==> $APP is already up to date ($OLD_VER).\e[0m"
          fi
