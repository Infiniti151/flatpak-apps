name: Trigger COPR Build
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - "apps/**/*.spec"

jobs:
  check-and-build:
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      COLOR_INFO: "\e[1;36m"
      COLOR_SUCCESS: "\e[1;32m"
      COLOR_WARN: "\e[1;33m"
      COLOR_RESET: "\e[0m"
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_name: aerion
            upstream_repo: hkdb/aerion
            provider: github
          - app_name: amberol
            upstream_repo: World/amberol
            provider: gitlab
            instance: gitlab.gnome.org
          - app_name: bobby
            upstream_repo: hbons/bobby
            provider: github
          - app_name: concessio
            upstream_repo: ronniedroid/concessio
            provider: github
          - app_name: exercise-timer
            upstream_repo: World/exercise-timer
            provider: gitlab
            instance: gitlab.gnome.org
          - app_name: extension-manager
            upstream_repo: mjakeman/extension-manager
            provider: github
          - app_name: eyedropper
            upstream_repo: FineFindus/eyedropper
            provider: github
          - app_name: gitte
            upstream_repo: ckruse/Gitte
            provider: codeberg
          - app_name: keypunch
            upstream_repo: bragefuglseth/keypunch
            provider: github
          - app_name: konbucase
            upstream_repo: ryonakano/konbucase
            provider: github
          - app_name: laser
            upstream_repo: andreasknoben/Laser
            provider: codeberg
          - app_name: missioncenter
            upstream_repo: mission-center-devs/mission-center
            provider: gitlab
            instance: gitlab.com
          - app_name: morse
            upstream_repo: teacond/morse
            provider: github
          - app_name: mundi
            upstream_repo: nacho/mundi
            provider: github
          - app_name: netpeek
            upstream_repo: ZingyTomato/NetPeek
            provider: github
          - app_name: newsflash
            upstream_repo: news-flash/news_flash_gtk
            provider: gitlab
            instance: gitlab.com
          - app_name: nucleus
            upstream_repo: lo-vely/nucleus
            provider: codeberg
          - app_name: planify
            upstream_repo: alainm23/planify
            provider: github
          - app_name: pods
            upstream_repo: marhkb/pods
            provider: github
          - app_name: rustdiff
            upstream_repo: jereok91/rustdiff
            provider: github
          - app_name: spellingbee
            upstream_repo: josephmawa/SpellingBee
            provider: github
          - app_name: sudoku
            upstream_repo: sepehr-rs/sudoku
            provider: github
          - app_name: text-compare
            upstream_repo: josephmawa/TextCompare
            provider: github
          - app_name: tomatillo
            upstream_repo: diegopvlk/Tomatillo
            provider: github
          - app_name: transition
            upstream_repo: grinka/transition
            provider: codeberg
          - app_name: words-game
            upstream_repo: petsoi/words
            provider: codeberg
    steps:
      - name: Checkout Subdirectory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            apps/${{ matrix.app_name }}
            scripts/changelog_scraper.py

      - name: Get Latest AppStream Version
        id: upstream
        env:
          PROVIDER: ${{ matrix.provider }}
          REPO: ${{ matrix.upstream_repo }}
          INSTANCE: ${{ matrix.instance }}
          APP: ${{ matrix.app_name }}
          SPEC: "apps/${{ matrix.app_name }}/${{ matrix.app_name }}.spec"
        run: |
          if [ ! -f "$SPEC" ]; then
            echo "::error::==> [ERROR] $SPEC not found!"
            exit 1
          fi

          APP_ID=$(grep -E '^\s*%global\s+(app_id|rdnn)\s+' "$SPEC" | awk '{print $3}')

          if [ -z "$APP_ID" ]; then
            echo "::error::==> [ERROR] Could not extract app_id or rdnn from $SPEC"
            exit 1
          fi

          echo -e "${COLOR_INFO}==> [INFO] Fetching AppStream version for $APP_ID...${COLOR_RESET}"

          TAG=$(python3 scripts/changelog_scraper.py get-version "$PROVIDER" "$INSTANCE" "$REPO" "$APP_ID")

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::==> [ERROR] Could not fetch version from metainfo for $REPO ($APP_ID)"
            exit 1
          fi

          echo -e "${COLOR_SUCCESS}==> [SUCCESS] Found AppStream release version: $TAG${COLOR_RESET}"
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Check for Updates
        id: check
        env:
          APP: ${{ matrix.app_name }}
          SPEC: apps/${{ matrix.app_name }}/${{ matrix.app_name }}.spec
          NEW_VER: ${{ steps.upstream.outputs.version }}
        run: |
          if [ ! -f "$SPEC" ]; then
            echo "::error::==> [ERROR] $SPEC not found!"
            exit 1
          fi

          OLD_VER=$(awk '/^Version:/ {print $2}' "$SPEC")
          CLEAN_NEW_VER=$(echo "$NEW_VER" | sed -E 's/^[vV]\.?//')

          echo -e "${COLOR_INFO}==> [INFO] Current: $OLD_VER | Upstream: $CLEAN_NEW_VER${COLOR_RESET}"

          if [ "$OLD_VER" != "$CLEAN_NEW_VER" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "old_version=$OLD_VER" >> $GITHUB_OUTPUT
            echo "new_version=$CLEAN_NEW_VER" >> $GITHUB_OUTPUT
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
            echo -e "${COLOR_SUCCESS}==> [SUCCESS] $APP is already up to date.${COLOR_RESET}"
          fi

      - name: Bump Version in Spec File
        if: steps.check.outputs.update_needed == 'true'
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROVIDER: "${{ matrix.provider }}"
          REPO: "${{ matrix.upstream_repo }}"
          INSTANCE: "${{ matrix.instance }}"
          APP: "${{ matrix.app_name }}"
          SPEC: "apps/${{ matrix.app_name }}/${{ matrix.app_name }}.spec"
          NEW_VER: ${{ steps.upstream.outputs.version }}
        run: |
          echo -e "${COLOR_INFO}==> [INFO] Bumping $APP to $NEW_VER...${COLOR_RESET}"
          CLEAN_NEW_VER=$(echo "$NEW_VER" | sed -E 's/^[vV]\.?//')
          sed -i "s/^Version:.*/Version:        $CLEAN_NEW_VER/" "$SPEC"

          if [ "$APP" = "sudoku" ]; then
            echo -e "${COLOR_INFO}==> [INFO] Fetching external python3-requirements.json...${COLOR_RESET}"

            REQ_URL="https://raw.githubusercontent.com/${REPO}/${NEW_VER}/python3-requirements.json"
            REQ_DATA=$(curl -sSf "$REQ_URL" 2>/dev/null)

            if [ $? -eq 0 ] && [ -n "$REQ_DATA" ]; then
              ENGINE_URL=$(echo "$REQ_DATA" | jq -r '.sources[]? | select(.url | contains("sudoku_engine"))? | .url // empty')

              if [ -n "$ENGINE_URL" ] && [ "$ENGINE_URL" != "null" ]; then
                ESC_URL="${ENGINE_URL//\//\\\/}"
                sed -i "s/^Source1:.*/Source1:        $ESC_URL/" "$SPEC"
                echo -e "${COLOR_SUCCESS}==> [SUCCESS] Updated sudoku-engine URL: $ENGINE_URL.${COLOR_RESET}"
              else
                echo -e "${COLOR_WARN}==> [WARNING] Could not parse sudoku-engine URL from requirements file. Keeping existing Source1.${COLOR_RESET}"
              fi
            else
              echo -e "${COLOR_WARN}==> [WARNING] Failed to fetch external requirements file. Keeping existing Source1.${COLOR_RESET}"
            fi
          fi

          APP_ID=$(grep -E '^\s*%global\s+(app_id|rdnn)\s+' "$SPEC" | awk '{print $3}')
          CHANGELOG=$(python3 scripts/changelog_scraper.py get-changelog "$PROVIDER" "$INSTANCE" "$REPO" "$APP_ID" "$NEW_VER")

          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          DATE=$(date +"%a %b %d %Y")
          AUTHOR="Infiniti151 <43163551+Infiniti151@users.noreply.github.com>"
          echo "* $DATE $AUTHOR - $NEW_VER-1" > entry.tmp
          echo "$CHANGELOG" >> entry.tmp
          echo "" >> entry.tmp

          if grep -q "^%changelog" "$SPEC"; then
            sed -i "/^%changelog/r entry.tmp" "$SPEC"
          else
            sed -i -e :a -e '/^\n*$/{$d;N;ba' -e '}' "$SPEC"

            echo -e "\n\n%changelog" >> "$SPEC"
            cat entry.tmp >> "$SPEC"
          fi

          rm entry.tmp

      - name: Auto-Commit Spec File
        if: steps.check.outputs.update_needed == 'true'
        uses: 
          suzuki-shunsuke/commit-action@06e3b49d4706498d325d29bd85adc82ecf2f5d8f     # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          branch: main
          commit_message: "chore(${{ matrix.app_name }}): bump spec version to ${{
            steps.upstream.outputs.version }}"
          files: "apps/${{ matrix.app_name }}/${{ matrix.app_name }}.spec"
          fail_on_self_push: false

      - name: Trigger COPR Build
        if: steps.check.outputs.update_needed == 'true'
        env:
          APP: ${{ matrix.app_name }}
          COPR_URL: ${{ secrets.COPR_BASE_WEBHOOK_URL }}
        run: |
          BASE_URL=$(echo "$COPR_URL" | xargs)
          FINAL_URL="${BASE_URL%/}/$APP/"

          echo -e "${COLOR_INFO}==> [INFO] Triggering COPR build...${COLOR_RESET}"
          if curl -fsS -X POST "$FINAL_URL"; then
            echo -e "${COLOR_SUCCESS}==> [SUCCESS] Triggered COPR build!${COLOR_RESET}"
          else
            echo "::error::==> [ERROR] Webhook failed to trigger COPR build."
            exit 1
          fi

      - name: Add to Workflow Summary
        if: steps.check.outputs.update_needed == 'true'
        env:
          APP: ${{ matrix.app_name }}
          OLD_VERSION: ${{ steps.check.outputs.old_version }}
          NEW_VERSION: ${{ steps.check.outputs.new_version }}
          CHANGELOG: ${{ steps.update.outputs.changelog }}
        run: |
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ### 🚀 COPR Build Triggered
          **App:** $APP
          **Version:** $OLD_VERSION -> $NEW_VERSION
          **Changelog:**
          $CHANGELOG
          EOF

  update-readme:
    needs: check-and-build
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Sync Changed Spec Versions to README
        env:
          START_SHA: ${{ github.sha }}
        run: |
          if [ ! -f "README.md" ]; then
            echo "README.md not found, skipping sync."
            exit 0
          fi

          # Get spec files modified between workflow start ($START_SHA) and current HEAD
          CHANGED_SPECS=$(git diff --name-only "$START_SHA" HEAD -- 'apps/*/*.spec' 2>/dev/null || true)

          if [ -z "$CHANGED_SPECS" ]; then
            echo "No spec files modified in this workflow run. Skipping README update."
            exit 0
          fi

          # Extract unique app names from paths: apps/<app_name>/<app_name>.spec
          CHANGED_APPS=$(echo "$CHANGED_SPECS" | cut -d'/' -f2 | sort -u)

          echo "Found modified spec files in this run:"
          echo "$CHANGED_APPS"

          while IFS= read -r APP_NAME; do
            [ -n "$APP_NAME" ] || continue
            SPEC="apps/${APP_NAME}/${APP_NAME}.spec"

            if [ -f "$SPEC" ]; then
              VER=$(awk '/^Version:/ {print $2}' "$SPEC")
              if [ -n "$VER" ] && grep -q "| $APP_NAME " "README.md"; then
                echo "Updating README row for $APP_NAME -> $VER"
                sed -i "/| $APP_NAME[^|]*|/ s/| [0-9.]* |/| $VER |/" "README.md"
              fi
            fi
          done <<< "$CHANGED_APPS"

      - name: Auto-Commit README Changes
        uses: 
          suzuki-shunsuke/commit-action@06e3b49d4706498d325d29bd85adc82ecf2f5d8f     # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          branch: main
          commit_message: "chore: sync updated spec versions to README.md"
          files: "README.md"
          fail_on_self_push: false
