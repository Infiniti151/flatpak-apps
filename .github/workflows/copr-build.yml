name: Trigger COPR Build
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - "apps/**/*.spec"

jobs:
  check-and-build:
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      COLOR_INFO: "\e[1;36m"
      COLOR_SUCCESS: "\e[1;32m"
      COLOR_WARN: "\e[1;33m"
      COLOR_RESET: "\e[0m"
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_name: aerion
            upstream_repo: hkdb/aerion
            provider: github
          - app_name: amberol
            upstream_repo: World/amberol
            provider: gitlab
            instance: gitlab.gnome.org
          - app_name: bobby
            upstream_repo: hbons/bobby
            provider: github
          - app_name: concessio
            upstream_repo: ronniedroid/concessio
            provider: github
          - app_name: extension-manager
            upstream_repo: mjakeman/extension-manager
            provider: github
          - app_name: eyedropper
            upstream_repo: FineFindus/eyedropper
            provider: github
          - app_name: gitte
            upstream_repo: ckruse/Gitte
            provider: codeberg
          - app_name: keypunch
            upstream_repo: bragefuglseth/keypunch
            provider: github
          - app_name: konbucase
            upstream_repo: ryonakano/konbucase
            provider: github
          - app_name: missioncenter
            upstream_repo: mission-center-devs/mission-center
            provider: gitlab
            instance: gitlab.com
          - app_name: morse
            upstream_repo: teacond/morse
            provider: github
          - app_name: mundi
            upstream_repo: nacho/mundi
            provider: github
          - app_name: netpeek
            upstream_repo: ZingyTomato/NetPeek
            provider: github
          - app_name: nucleus
            upstream_repo: lo-vely/nucleus
            provider: codeberg
          - app_name: planify
            upstream_repo: alainm23/planify
            provider: github
          - app_name: pods
            upstream_repo: marhkb/pods
            provider: github
          - app_name: rustdiff
            upstream_repo: jereok91/rustdiff
            provider: github
          - app_name: spellingbee
            upstream_repo: josephmawa/SpellingBee
            provider: github
          - app_name: sudoku
            upstream_repo: sepehr-rs/sudoku
            provider: github
          - app_name: text-compare
            upstream_repo: josephmawa/TextCompare
            provider: github
          - app_name: tomatillo
            upstream_repo: diegopvlk/Tomatillo
            provider: github
          - app_name: words-game
            upstream_repo: petsoi/words
            provider: codeberg
    steps:
      - name: Checkout Subdirectory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            apps/${{ matrix.app_name }}
            README.md

      - name: Get Latest Upstream Tag
        id: upstream
        env:
          PROVIDER: ${{ matrix.provider }}
          REPO: ${{ matrix.upstream_repo }}
          INSTANCE: ${{ matrix.instance }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          fetch_tag() {
            local url=$1
            local attempt=1
            local max_attempts=4
            local wait_time=3
            local result=""
            local response_code=""

            while [ $attempt -le $max_attempts ]; do
              local body_file=$(mktemp)

              if [[ "$url" == *"api.github.com"* ]]; then
                response_code=$(curl -sS -L -w "%{http_code}" -o "$body_file" \
                  -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github+json" "$url")
              else
                response_code=$(curl -sS -L -w "%{http_code}" -o "$body_file" "$url")
              fi

              result=$(cat "$body_file")
              rm -f "$body_file"

              if [ "$response_code" -eq 200 ] && [ -n "$result" ] && [ "$result" != "[]" ]; then
                echo "$result"
                return 0
              fi

              echo -e "${COLOR_WARN}==> [WARN] Attempt $attempt failed (HTTP $response_code) for $url.${COLOR_RESET}" >&2

              if [ $attempt -eq $max_attempts ]; then
                break
              fi

              local jitter=$(( RANDOM % 4 ))
              local sleep_duration=$(( wait_time + jitter ))
              echo -e "${COLOR_INFO}==> [INFO] Retrying in ${sleep_duration}s...${COLOR_RESET}" >&2
              sleep $sleep_duration

              wait_time=$(( wait_time * 2 ))
              ((attempt++))
            done
            return 1
          }

          if [ "$PROVIDER" = "github" ]; then
            DATA=$(fetch_tag "https://api.github.com/repos/$REPO/tags")
            TAG=$(echo "$DATA" | jq -r '.[].name // empty' | grep -Ex '[vV]?[0-9]+(\.[0-9]+)*' | sort -V | tail -n 1)
          elif [ "$PROVIDER" = "gitlab" ]; then
            ENCODED=$(echo "$REPO" | sed 's/\//%2F/g')
            DATA=$(fetch_tag "https://$INSTANCE/api/v4/projects/${ENCODED}/repository/tags?order_by=version&sort=desc")
            TAG=$(echo "$DATA" | jq -r '.[0].name // empty')
          elif [ "$PROVIDER" = "codeberg" ]; then
            DATA=$(fetch_tag "https://codeberg.org/api/v1/repos/$REPO/tags")
            TAG=$(echo "$DATA" | jq -r '.[0].name // empty')
          fi

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::==> [ERROR] Could not fetch tag for $REPO after multiple attempts"
            exit 1
          fi

          echo -e "${COLOR_SUCCESS}==> [SUCCESS] Found tag: $TAG${COLOR_RESET}"
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Check for Updates
        id: check
        env:
          APP: ${{ matrix.app_name }}
          SPEC: apps/${{ matrix.app_name }}/${{ matrix.app_name }}.spec
          NEW_VER: ${{ steps.upstream.outputs.version }}
        run: |
          if [ ! -f "$SPEC" ]; then
            echo "::error::==> [ERROR] $SPEC not found!"
            exit 1
          fi

          OLD_VER=$(awk '/^Version:/ {print $2}' "$SPEC")

          CLEAN_NEW_VER="${NEW_VER#[vV]}"

          echo -e "${COLOR_INFO}==> [INFO] Current: $OLD_VER | Upstream: $CLEAN_NEW_VER${COLOR_RESET}"

          if [ "$OLD_VER" != "$CLEAN_NEW_VER" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "old_version=$OLD_VER" >> $GITHUB_OUTPUT
            echo "new_version=$CLEAN_NEW_VER" >> $GITHUB_OUTPUT
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
            echo -e "${COLOR_SUCCESS}==> [SUCCESS] $APP is already up to date.${COLOR_RESET}"
          fi

      - name: Bump Version and Push
        if: steps.check.outputs.update_needed == 'true'
        id: update
        env:
          PROVIDER: "${{ matrix.provider }}"
          REPO: "${{ matrix.upstream_repo }}"
          INSTANCE: "${{ matrix.instance }}"
          APP: "${{ matrix.app_name }}"
          SPEC: "apps/${{ matrix.app_name }}/${{ matrix.app_name }}.spec"
          README: "README.md"
          NEW_VER: ${{ steps.upstream.outputs.version }}
        run: |
          echo -e "${COLOR_INFO}==> [INFO] Bumping $APP to $NEW_VER...${COLOR_RESET}"
          CLEAN_NEW_VER="${NEW_VER#[vV]}"
          sed -i "s/^Version:.*/Version:        $CLEAN_NEW_VER/" "$SPEC"

          if [ "$APP" = "sudoku" ]; then
            echo -e "${COLOR_INFO}==> [INFO] Fetching external python3-requirements.json...${COLOR_RESET}"

            REQ_URL="https://raw.githubusercontent.com/${REPO}/${NEW_VER}/python3-requirements.json"
            REQ_DATA=$(curl -sSf "$REQ_URL" 2>/dev/null)

            if [ $? -eq 0 ] && [ -n "$REQ_DATA" ]; then
              ENGINE_URL=$(echo "$REQ_DATA" | jq -r '.sources[]? | select(.url | contains("sudoku_engine"))? | .url // empty')

              if [ -n "$ENGINE_URL" ] && [ "$ENGINE_URL" != "null" ]; then
                ESC_URL="${ENGINE_URL//\//\\\/}"
                sed -i "s/^Source1:.*/Source1:        $ESC_URL/" "$SPEC"
                echo -e "${COLOR_SUCCESS}==> [SUCCESS] Updated sudoku-engine URL: $ENGINE_URL.${COLOR_RESET}"
              else
                echo -e "${COLOR_WARN}==> [WARNING] Could not parse sudoku-engine URL from requirements file. Keeping existing Source1.${COLOR_RESET}"
              fi
            else
              echo -e "${COLOR_WARN}==> [WARNING] Failed to fetch external requirements file. Keeping existing Source1.${COLOR_RESET}"
            fi
          fi

          if [ "$PROVIDER" = "github" ]; then
            CHANGELOG_BODY=$(curl -s "https://api.github.com/repos/$REPO/releases/latest" | jq -r '.body // empty')
          elif [ "$PROVIDER" = "gitlab" ]; then
            ENCODED="${REPO//\//%2F}"
            CHANGELOG_BODY=$(curl -s "https://$INSTANCE/api/v4/projects/${ENCODED}/releases/${NEW_VER}" | jq -r '.description // empty')
          elif [ "$PROVIDER" = "codeberg" ]; then
            CHANGELOG_BODY=$(curl -s "https://codeberg.org/api/v1/repos/$REPO/releases/latest" | jq -r '.body // empty')
          fi

          if [ -z "$CHANGELOG_BODY" ] || [ "$CHANGELOG_BODY" = "null" ]; then
            CHANGELOG="- Update to $NEW_VER"
          else
            CHANGELOG_RAW=$(echo "$CHANGELOG_BODY" | \
              sed 's/<[^>]*>//g' | \
              sed 's/^#* //g' | \
              sed -E 's/^[[:space:]]*[-*•][[:space:]]*//' | \
              sed 's/^[[:space:]]*//' | \
              sed '/^$/d')

            LINE_COUNT=$(wc -l <<< "$CHANGELOG_RAW")

            if [ "$LINE_COUNT" -gt 10 ]; then
              CHANGELOG=$(echo "$CHANGELOG_RAW" | head -n 10 | sed 's/^/- /')
              CHANGELOG="$CHANGELOG"$'\n- ... (see upstream for full release notes)'
            else
              CHANGELOG="- ${CHANGELOG_RAW//$'\n'/$'\n'- }"
            fi
          fi

          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          DATE=$(date +"%a %b %d %Y")
          AUTHOR="Infiniti151 <43163551+Infiniti151@users.noreply.github.com>"
          echo "* $DATE $AUTHOR - $NEW_VER-1" > entry.tmp
          echo "$CHANGELOG" >> entry.tmp
          echo "" >> entry.tmp

          if grep -q "^%changelog" "$SPEC"; then
            sed -i "/^%changelog/r entry.tmp" "$SPEC"
          else
            sed -i -e :a -e '/^\n*$/{$d;N;ba' -e '}' "$SPEC"

            echo -e "\n\n%changelog" >> "$SPEC"
            cat entry.tmp >> "$SPEC"
          fi

          rm entry.tmp

          if [ -f "$README" ]; then
            sed -i "/| $APP[^|]*|/ s/| [0-9.]* |/| $CLEAN_NEW_VER |/" "$README"
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SPEC" "$README"
          git commit -m "chore($APP): bump version to $NEW_VER"

          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo -e "${COLOR_INFO}==> [INFO] Push attempt $i...${COLOR_RESET}"
            if git pull --rebase origin main && git push origin main; then
              echo -e "${COLOR_SUCCESS}==> [SUCCESS] Updated readme and spec file.${COLOR_RESET}"
              break
            fi
            if [ $i -eq $MAX_RETRIES ]; then
              echo "::error::==> [ERROR] Failed to push after $MAX_RETRIES attempts."
              exit 1
            fi
            sleep $(( (RANDOM % 10) + 1 ))
          done

      - name: Trigger COPR Build
        if: steps.check.outputs.update_needed == 'true'
        env:
          APP: ${{ matrix.app_name }}
          COPR_URL: ${{ secrets.COPR_BASE_WEBHOOK_URL }}
        run: |
          BASE_URL=$(echo "$COPR_URL" | xargs)
          FINAL_URL="${BASE_URL%/}/$APP/"

          echo -e "${COLOR_INFO}==> [INFO] Triggering COPR build...${COLOR_RESET}"
          if curl -fsS -X POST "$FINAL_URL"; then
            echo -e "${COLOR_SUCCESS}==> [SUCCESS] Triggered COPR build!${COLOR_RESET}"
          else
            echo "::error::==> [ERROR] Webhook failed to trigger COPR build."
            exit 1
          fi

      - name: Add to Workflow Summary
        if: steps.check.outputs.update_needed == 'true'
        env:
          APP: ${{ matrix.app_name }}
          OLD_VERSION: ${{ steps.check.outputs.old_version }}
          NEW_VERSION: ${{ steps.check.outputs.new_version }}
          CHANGELOG: ${{ steps.update.outputs.changelog }}
        run: |
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ### 🚀 COPR Build Triggered
          **App:** $APP
          **Version:** $OLD_VERSION -> $NEW_VERSION
          **Changelog:**
          $CHANGELOG
          EOF
