---
name: Trigger COPR Build
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - "apps/**/*.spec"

jobs:
  check-and-build:
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_name: text-compare
            upstream_repo: josephmawa/TextCompare
            provider: github
          - app_name: concessio
            upstream_repo: ronniedroid/concessio
            provider: github
          - app_name: missioncenter
            upstream_repo: mission-center-devs/mission-center
            provider: gitlab
            instance: gitlab.com
          - app_name: extension-manager
            upstream_repo: mjakeman/extension-manager
            provider: github
          - app_name: pods
            upstream_repo: marhkb/pods
            provider: github
          - app_name: tomatillo
            upstream_repo: diegopvlk/Tomatillo
            provider: github
          - app_name: konbucase
            upstream_repo: ryonakano/konbucase
            provider: github
          - app_name: keypunch
            upstream_repo: bragefuglseth/keypunch
            provider: github
          - app_name: gitte
            upstream_repo: ckruse/Gitte
            provider: codeberg
          - app_name: eyedropper
            upstream_repo: FineFindus/eyedropper
            provider: github
          - app_name: spellingbee
            upstream_repo: josephmawa/SpellingBee
            provider: github
          - app_name: amberol
            upstream_repo: World/amberol
            provider: gitlab
            instance: gitlab.gnome.org
          - app_name: bobby
            upstream_repo: hbons/bobby
            provider: github
          - app_name: rustdiff
            upstream_repo: jereok91/rustdiff
            provider: github
          - app_name: aerion
            upstream_repo: hkdb/aerion
            provider: github
          - app_name: mundi
            upstream_repo: nacho/mundi
            provider: github
          - app_name: morse
            upstream_repo: teacond/morse
            provider: github
          - app_name: sudoku
            upstream_repo: sepehr-rs/sudoku
            provider: github
          - app_name: nucleus
            upstream_repo: lo_vely/nucleus
            provider: codeberg

    steps:
      - name: Checkout Subdirectory
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sparse-checkout: |
            apps/${{ matrix.app_name }}
            README.md

      - name: Get Latest Upstream Tag
        id: upstream
        env:
          PROVIDER: ${{ matrix.provider }}
          REPO: ${{ matrix.upstream_repo }}
          INSTANCE: ${{ matrix.instance }}
        run: |
          fetch_tag() {
            local url=$1
            local attempt=1
            local max_attempts=3
            local result=""

            while [ $attempt -le $max_attempts ]; do
              result=$(curl -sSf "$url" 2>/dev/null)
              if [ $? -eq 0 ] && [ -n "$result" ] && [ "$result" != "[]" ]; then
                echo "$result"
                return 0
              fi
              echo -e "\e[1;33m==> [RETRY] Attempt $attempt failed for $url. Retrying in 5s...\e[0m" >&2
              sleep 5
              ((attempt++))
            done
            return 1
          }

          if [ "$PROVIDER" = "github" ]; then
            DATA=$(fetch_tag "https://api.github.com/repos/$REPO/tags")
            TAG=$(echo "$DATA" | jq -r '.[].name // empty' | grep -Ex '[vV]?[0-9]+(\.[0-9]+)*' | sort -V | tail -n 1)
          elif [ "$PROVIDER" = "gitlab" ]; then
            ENCODED=$(echo "$REPO" | sed 's/\//%2F/g')
            DATA=$(fetch_tag "https://$INSTANCE/api/v4/projects/${ENCODED}/repository/tags?order_by=version&sort=desc")
            TAG=$(echo "$DATA" | jq -r '.[0].name // empty')
          elif [ "$PROVIDER" = "codeberg" ]; then
            DATA=$(fetch_tag "https://codeberg.org/api/v1/repos/$REPO/tags")
            TAG=$(echo "$DATA" | jq -r '.[0].name // empty')
          fi

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo -e "\e[1;31m==> [ERROR] Could not fetch tag for $REPO after multiple attempts\e[0m"
            exit 1
          fi

          echo -e "\e[1;32m==> [SUCCESS] Found tag: $TAG\e[0m"
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Check for Updates
        id: check
        env:
          APP: ${{ matrix.app_name }}
          SPEC: apps/${{ matrix.app_name }}/${{ matrix.app_name }}.spec
          NEW_VER: ${{ steps.upstream.outputs.version }}
        run: |
          if [ ! -f "$SPEC" ]; then
            echo -e "\e[1;31m==> [ERROR] $SPEC not found!\e[0m"
            exit 1
          fi

          OLD_VER=$(grep -m1 '^Version:' "$SPEC" | awk '{print $2}')

          CLEAN_NEW_VER=$(echo "$NEW_VER" | sed 's/^[vV]//')

          echo -e "\e[1;36m==> Current: $OLD_VER | Upstream: $CLEAN_NEW_VER\e[0m"

          if [ "$OLD_VER" != "$CLEAN_NEW_VER" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
            echo -e "\e[1;32m==> $APP is already up to date.\e[0m"
          fi

      - name: Bump Version and Push
        if: steps.check.outputs.update_needed == 'true'
        env:
          PROVIDER: "${{ matrix.provider }}"
          REPO: "${{ matrix.upstream_repo }}"
          INSTANCE: "${{ matrix.instance }}"
          APP: "${{ matrix.app_name }}"
          SPEC: "apps/${{ matrix.app_name }}/${{ matrix.app_name }}.spec"
          README: "README.md"
          NEW_VER: ${{ steps.upstream.outputs.version }}
        run: |
          echo -e "\e[1;36m==> Bumping $APP to $NEW_VER...\e[0m"
          CLEAN_VER=$(echo "$NEW_VER" | sed 's/^[vV]//')
          sed -i "s/^Version:.*/Version:        $CLEAN_VER/" "$SPEC"

          if [ "$APP" = "sudoku" ]; then
            echo -e "\e[1;36m==> [SUDOKU] Fetching external python3-requirements.json...\e[0m"

            REQ_URL="https://raw.githubusercontent.com/${REPO}/${NEW_VER}/python3-requirements.json"
            REQ_DATA=$(curl -sSf "$REQ_URL" 2>/dev/null)

            if [ $? -eq 0 ] && [ -n "$REQ_DATA" ]; then
              ENGINE_URL=$(echo "$REQ_DATA" | jq -r '.sources[]? | select(.url | contains("sudoku_engine"))? | .url // empty')

              if [ -n "$ENGINE_URL" ] && [ "$ENGINE_URL" != "null" ]; then
                echo -e "\e[1;32m==> [SUDOKU] Found engine URL: $ENGINE_URL\e[0m"
                ESC_URL=$(echo "$ENGINE_URL" | sed 's/\//\\\//g')
                sed -i "s/^Source1:.*/Source1:        $ESC_URL/" "$SPEC"
              else
                echo -e "\e[1;33m==> [WARNING] Could not parse sudoku-engine URL from requirements file. Keeping existing Source1.\e[0m"
              fi
            else
              echo -e "\e[1;33m==> [WARNING] Failed to fetch external requirements file. Keeping existing Source1.\e[0m"
            fi
          fi

          if [ "$PROVIDER" = "github" ]; then
            CHANGELOG_BODY=$(curl -s "https://api.github.com/repos/$REPO/releases/latest" | jq -r '.body // empty')
          elif [ "$PROVIDER" = "gitlab" ]; then
            ENCODED=$(echo "$REPO" | sed 's/\//%2F/g')
            CHANGELOG_BODY=$(curl -s "https://$INSTANCE/api/v4/projects/${ENCODED}/releases/${NEW_VER}" | jq -r '.description // empty')
          elif [ "$PROVIDER" = "codeberg" ]; then
            CHANGELOG_BODY=$(curl -s "https://codeberg.org/api/v1/repos/$REPO/releases/latest" | jq -r '.body // empty')
          fi

          if [ -z "$CHANGELOG_BODY" ] || [ "$CHANGELOG_BODY" = "null" ]; then
            CHANGELOG="- Update to $NEW_VER"
          else
            CHANGELOG_RAW=$(echo "$CHANGELOG_BODY" | \
              sed 's/<[^>]*>//g' | \
              sed 's/^#* //g' | \
              sed -E 's/^[[:space:]]*[-*•][[:space:]]*//' | \
              sed 's/^[[:space:]]*//' | \
              sed '/^$/d')

            LINE_COUNT=$(echo "$CHANGELOG_RAW" | wc -l)

            if [ "$LINE_COUNT" -gt 10 ]; then
              CHANGELOG=$(echo "$CHANGELOG_RAW" | head -n 10 | sed 's/^/- /')
              CHANGELOG="$CHANGELOG"$'\n- ... (see upstream for full release notes)'
            else
              CHANGELOG=$(echo "$CHANGELOG_RAW" | sed 's/^/- /')
            fi
          fi
          DATE=$(date +"%a %b %d %Y")
          AUTHOR="Infiniti151 <43163551+Infiniti151@users.noreply.github.com>"
          echo "* $DATE $AUTHOR - $NEW_VER-1" > entry.tmp
          echo "$CHANGELOG" >> entry.tmp
          echo "" >> entry.tmp

          if grep -q "^%changelog" "$SPEC"; then
            sed -i "/^%changelog/r entry.tmp" "$SPEC"
          else
            sed -i -e :a -e '/^\n*$/{$d;N;ba' -e '}' "$SPEC"

            echo -e "\n\n%changelog" >> "$SPEC"
            cat entry.tmp >> "$SPEC"
          fi

          rm entry.tmp

          if [ -f "$README" ]; then
            sed -i "/| $APP[^|]*|/ s/| [0-9.]* |/| $CLEAN_VER |/" "$README"
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SPEC" "$README"
          git commit -m "chore($APP): bump version to $NEW_VER"
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo -e "\e[1;36m==> Push attempt $i...\e[0m"
            if git pull --rebase origin main && git push origin main; then
              echo -e "\e[1;32m==> Successfully pushed $APP update.\e[0m"
              break
            fi
            if [ $i -eq $MAX_RETRIES ]; then
              echo -e "\e[1;31m==> [ERROR] Failed to push after $MAX_RETRIES attempts.\e[0m"
              exit 1
            fi
            sleep $(( (RANDOM % 10) + 1 ))
          done

      - name: Trigger COPR Build
        if: steps.check.outputs.update_needed == 'true'
        env:
          APP: ${{ matrix.app_name }}
          COPR_URL: ${{ secrets.COPR_BASE_WEBHOOK_URL }}
        run: |
          BASE_URL=$(echo "$COPR_URL" | xargs)
          FINAL_URL="${BASE_URL%/}/$APP/"

          echo -e "\e[1;36m==> Triggering COPR for $APP...\e[0m"
          if curl -fsS -X POST "$FINAL_URL"; then
            echo -e "\e[1;32m==> COPR build triggered successfully for $APP!\e[0m"
          else
            echo -e "\e[1;31m==> [ERROR] Webhook failed to trigger COPR.\e[0m"
            exit 1
          fi
