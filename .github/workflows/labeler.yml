---
name: Issue and PR Labeler
on:
  pull_request:
    types: [opened, edited]
  issues:
    types: [opened, edited]

jobs:
  labeler:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Auto-label based on checkboxes and version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            // Determine if this is an issue or a PR
            const payload = context.payload.issue || context.payload.pull_request;
            const body = payload.body;
            if (!body) return;

            const labels = [];

            // 1. Technical Type Labels (Checkbox logic)
            if (body.includes('- [x] **New App**')) labels.push('enhancement');
            if (body.includes('- [x] **Bug Fix**')) labels.push('bugfix');
            if (body.includes('- [x] **Optimization**')) labels.push('optimization');

            // 2. Fedora Version Regex Logic
            const versionRegex = /-\s\*\*Fedora Version:\*\*\s*(?:<!--.*?-->\s*)?([0-9a-zA-Z]+)/i;
            const match = body.match(versionRegex);

            if (match && match[1]) {
              const versionInput = match[1].trim();
              let versionLabel;

              if (['rawhide', 'eln'].includes(versionInput.toLowerCase())) {
                versionLabel = `Fedora ${versionInput.toUpperCase().replace('RAWHIDE', 'Rawhide')}`;
              } else if (!isNaN(versionInput)) {
                versionLabel = `Fedora ${versionInput}`;
              }

              if (versionLabel) labels.push(versionLabel);
            }

            // 3. Apply labels
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: payload.number,
                labels: [...new Set(labels)]
              });
            }