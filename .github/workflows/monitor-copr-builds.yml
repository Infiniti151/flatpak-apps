name: Monitor COPR Builds

on:
  workflow_run:
    workflows:
      - Trigger COPR Build
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  monitor-builds:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BUILD_FILE: "artifacts/copr-builds.txt"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Build Metadata Artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p artifacts

          gh run download "$RUN_ID" \
            --name copr-builds \
            --dir artifacts || echo "==> [INFO] No copr-builds artifact found."

      - name: Check for Build Metadata
        id: check-builds
        run: |
          if [ ! -f "$BUILD_FILE" ] || [ ! -s "$BUILD_FILE" ]; then
            echo "has_builds=false" >> $GITHUB_OUTPUT
            echo "==> [INFO] No builds found. Skipping remaining steps."
          else
            echo "has_builds=true" >> $GITHUB_OUTPUT
            echo "==> [INFO] Builds found. Proceeding..."
          fi

      - name: Install Dependencies
        if: steps.check-builds.outputs.has_builds == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2
          pip install --no-cache-dir requests cairosvg

      - name: Check COPR Builds & Notify
        if: steps.check-builds.outputs.has_builds == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 scripts/check_copr_builds.py artifacts/copr-builds.txt
