name: Validate PR Requirements

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-checklist:
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
    name: Check PR Description & Spec Standards
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate PR Description Checklist
        id: checklist
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          TYPE_SECTION=$(echo "$PR_BODY" | sed -n '/## ⚒️ Type of Change/,/## 🧪 Quality Checklist/p')
          TYPE_CHECKED=$(echo "$TYPE_SECTION" | grep -c '^[[:space:]]*-[[:space:]]*\[[xX]\]' || true)

          if [ "$TYPE_CHECKED" -lt 1 ]; then
            echo "❌ ERROR: You must select at least one 'Type of Change'."
            exit 1
          fi

          if echo "$TYPE_SECTION" | grep -iq '\[[xX]\].*New App:'; then
            echo "pr_type=new_app" >> "$GITHUB_OUTPUT"
            echo "ℹ️ PR Type includes: New App"
          else
            echo "ℹ️ PR Type: not a New App"
          fi

          QUALITY_SECTION=$(echo "$PR_BODY" | sed -n '/## 🧪 Quality Checklist/,/## 🔗 Related Issue/p')
          QUALITY_TOTAL=$(echo "$QUALITY_SECTION" | grep -c '^[[:space:]]*-[[:space:]]*\[' || true)
          QUALITY_CHECKED=$(echo "$QUALITY_SECTION" | grep -c '^[[:space:]]*-[[:space:]]*\[[xX]\]' || true)

          if [ "$QUALITY_CHECKED" -ne 4 ] || [ "$QUALITY_CHECKED" -ne "$QUALITY_TOTAL" ]; then
            echo "❌ ERROR: All items in 'Quality Checklist' MUST be checked ($QUALITY_CHECKED/$QUALITY_TOTAL)."
            exit 1
          fi

      - name: Validate Spec File Standards
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_TYPE: ${{ steps.checklist.outputs.pr_type }}
        run: |
          # Added/modified (not deleted) .spec files in apps/ in this PR
          SPEC_FILES=$(git diff --name-only --diff-filter=d "origin/${BASE_REF}...HEAD" -- 'apps/*.spec' || true)

          if [ -z "$SPEC_FILES" ]; then
            if [ "$PR_TYPE" = "new_app" ]; then
              echo "❌ ERROR: 'New App' selected, but no new .spec file was found in apps/."
              exit 1
            fi
            echo "ℹ️ No .spec files in apps/ changed in this PR."
            exit 0
          fi

          FAILED=0
          NEW_COUNT=0

          for SPEC in $SPEC_FILES; do
            VERSION_VAL=$(grep -i '^[[:space:]]*Version:' "$SPEC" | head -n1 | awk '{print $2}')

            if grep -q '^[[:space:]]*%changelog' "$SPEC"; then
              HAS_CHANGELOG=true
            else
              HAS_CHANGELOG=false
            fi

            # A spec is an existing app's if the file already exists on the base branch
            if git cat-file -e "origin/${BASE_REF}:${SPEC}" 2>/dev/null; then
              echo "==> $SPEC: existing app, checking update standards..."

              # 1. Version must have moved past the new-app placeholder
              if [ -z "$VERSION_VAL" ] || [ "$VERSION_VAL" = "0" ]; then
                echo "❌ ERROR in $SPEC: Existing app Version must not be 0 (found Version: ${VERSION_VAL:-<none>})."
                FAILED=1
              else
                echo "✅ Version validation passed ($VERSION_VAL)."
              fi

              # 2. %changelog must exist
              if [ "$HAS_CHANGELOG" = false ]; then
                echo "❌ ERROR in $SPEC: Existing app is missing its '%changelog' section."
                echo "Do not remove it; changelogs are handled by our workflow."
                FAILED=1
              else
                echo "✅ %changelog section found."
              fi
            else
              NEW_COUNT=$((NEW_COUNT + 1))
              echo "==> $SPEC: new app, checking New App compliance..."

              # 1. Version must be exactly 0
              if [[ "$VERSION_VAL" != "0" ]]; then
                echo "❌ ERROR in $SPEC: New App initial Version must be exactly 0 (found Version: ${VERSION_VAL:-<none>})."
                echo "Please set 'Version: 0' in the spec file."
                FAILED=1
              else
                echo "✅ Version validation passed ($VERSION_VAL)."
              fi

              # 2. %changelog must NOT be present
              if [ "$HAS_CHANGELOG" = true ]; then
                echo "❌ ERROR in $SPEC: Found '%changelog' section."
                echo "Changelogs are handled automatically in our workflow. Please remove the %changelog section."
                FAILED=1
              else
                echo "✅ No %changelog section found."
              fi
            fi
          done

          if [ "$PR_TYPE" = "new_app" ] && [ "$NEW_COUNT" -eq 0 ]; then
            echo "❌ ERROR: 'New App' selected, but every changed .spec file already exists in apps/."
            FAILED=1
          fi

          exit "$FAILED"
