---
name: Test RPM Build

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - "apps/**/*.spec"
  pull_request:
    branches:
      - dev
    paths:
      - "apps/**/*.spec"

jobs:
  check-version:
    runs-on: ubuntu-latest
    environment: Test
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Verify Spec Version
        id: check
        run: |
          SPEC_FILE=$(find apps/${{ vars.APP }} -maxdepth 1 -name "${{ vars.APP }}.spec" | head -n 1)
          
          if [ -z "$SPEC_FILE" ]; then
            echo -e "\e[1;31m [ERROR] No .spec file found in the repository!\e[0m"
            echo "should_build=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          VERSION=$(grep -i "^Version:" "$SPEC_FILE" | awk '{print $2}' | xargs)
          echo "Detected version: $VERSION"
          
          if [ "$VERSION" = "0.0.0" ] || [ -z "$VERSION" ]; then
            echo -e "\e[1;33m [WARNING] Version is a placeholder (0.0.0) or empty. Skipping build.\e[0m"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo -e "\e[1;32mVersion is valid ($VERSION). Proceeding to build.\e[0m"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi
  
  build:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: Test
    container:
      image: ghcr.io/infiniti151/flatpak2rpm-builder:latest
    env:
      RUSTC_WRAPPER: sccache
      #RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=/project"
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      #CC: "ccache clang"
      #CXX: "ccache clang++"
      CC: "sccache gcc"
      CXX: "sccache g++"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Unified Cache (Rust, C, and Tools)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "fedora-build-cache"
          cache-on-failure: "true"
          cache-targets: "true"
          add-rust-environment-hash-key: "false"
          cmd-format: "true ; # {0}"
          cache-directories: |
            .sccache
            .ccache
            **/rpmbuild/BUILD/**/redhat-linux-build/cargo-home

      - name: Start sccache
        run: sccache --start-server

      - name: Execute RPM Build
        run: |
          mkdir -p "$SCCACHE_DIR" "$CCACHE_DIR" "CARGO_HOME"

          cd "apps/${{ vars.APP }}"
          spectool -g *.spec

          rpmbuild -ba *.spec \
            --define "_topdir $GITHUB_WORKSPACE/rpmbuild" \
            --define "_sourcedir $(pwd)"

          echo "--- DEBUG START ---"
          echo ".sccache size: $(du -sh $SCCACHE_DIR | cut -f1)"
          echo ".sccache total items: $(find $SCCACHE_DIR -type f | wc -l)"
          echo ".ccache size: $(du -sh $CCACHE_DIR | cut -f1)"
          echo ".ccache total items: $(find $CCACHE_DIR -type f | wc -l)"
          echo ".cargo size: $(du -sh $CARGO_HOME | cut -f1)"
          echo ".cargo total items: $(find $CARGO_HOME -type f | wc -l)"
          echo "--- DEBUG END ---"
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: "*"

      - name: Show Performance Stats
        if: always()
        run: |
          sccache --show-stats
          ccache -s

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.APP }}-fc${{ vars.VER }}-rpm
          path: |
            rpmbuild/RPMS/*/*.rpm
            !rpmbuild/RPMS/*/*-debuginfo-*.rpm
            !rpmbuild/RPMS/*/*-debugsource-*.rpm