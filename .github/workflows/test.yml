---
name: Test RPM Build

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - "apps/**/*.spec"
  pull_request:
    branches:
      - dev
    paths:
      - "apps/**/*.spec"

jobs:
  check-version:
    runs-on: ubuntu-latest
    environment: Test
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if Push is a Sync from Main
        id: sync-check
        run: |
          git fetch origin main

          if git merge-base --is-ancestor HEAD origin/main; then
            echo -e "\e[1;33m [WARNING] This commit exists on main. Skipping RPM build for sync.\e[0m"
            echo "is_sync=true" >> $GITHUB_OUTPUT
          else
            echo "is_sync=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify Spec Version
        id: check
        if: steps.sync-check.outputs.is_sync == 'false'
        run: |
          SPEC_FILE=$(find apps/${{ vars.APP }} -maxdepth 1 -name "${{ vars.APP }}.spec" | head -n 1)

          if [ -z "$SPEC_FILE" ]; then
            echo -e "\e[1;31m [ERROR] No .spec file found in the repository!\e[0m"
            echo "should_build=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          VERSION=$(grep -i "^Version:" "$SPEC_FILE" | awk '{print $2}' | xargs)
          echo "Detected version: $VERSION"

          if [ "$VERSION" = "0.0.0" ] || [ -z "$VERSION" ]; then
            echo -e "\e[1;33m [WARNING] Version is a placeholder (0.0.0) or empty. Skipping build.\e[0m"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo -e "\e[1;32mVersion is valid ($VERSION). Proceeding to build.\e[0m"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-version
    if:
      needs.check-version.outputs.should_build == 'true' && github.ref ==
      'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: Test
    container:
      image: ghcr.io/infiniti151/flatpak2rpm-builder:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Restore Cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .ccache
            .sccache
            .cargo_cache
          key: ${{ runner.os }}-build-cache-${{ vars.APP }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-cache-${{ vars.APP }}-

      - name: Execute RPM Build
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: "*"
        run: |
          APP_DIR="apps/${{ vars.APP }}"
          SPEC_FILE="$APP_DIR/${{ vars.APP }}.spec"
          RPM_SOURCES="$GITHUB_WORKSPACE/rpmbuild/SOURCES"
          mkdir -p "$RPM_SOURCES"

          cd "$APP_DIR"

          echo -e "\e[1;33m📥 Downloading sources...\e[0m"
          spectool -g -C "$RPM_SOURCES" *.spec

          # 1. GCC / G++ Logic
          if grep -qiE "gcc|gcc-c\+\+" "$SPEC_FILE"; then
            echo -e "\e[1;36m🛠️ GCC detected. Enabling CC/CXX wrappers...\e[0m"
            export CCACHE_DIR="${{ github.workspace }}/.ccache"
            mkdir -p "$CCACHE_DIR"
            export CC="ccache gcc"
            export CXX="ccache g++"
          fi

          # 2. Clang / Clang++ Logic
          if grep -qiE "clang|clang\+\+" "$SPEC_FILE"; then
            echo -e "\e[1;36m🪄 Clang detected. Enabling Clang wrappers...\e[0m"
            export CCACHE_DIR="${{ github.workspace }}/.ccache"
            mkdir -p "$CCACHE_DIR"
            export CC="ccache clang"
            export CXX="ccache clang++"
          fi

          # 4. Rust / Cargo Logic
          if grep -qiE "rust|cargo" "../../$SPEC_FILE"; then
            echo -e "\e[1;36m🦀 Rust detected. Enabling sccache and deep-linking cargo-home...\e[0m"
            export SCCACHE_DIR="${{ github.workspace }}/.sccache"
            export RUSTC_WRAPPER="sccache"
            mkdir -p "$SCCACHE_DIR"
            sccache --start-server

            STABLE_CARGO_CACHE="${{ github.workspace }}/.cargo_cache"
            mkdir -p "$STABLE_CARGO_CACHE"

            echo -e "\e[1;33m📦 Preparing source for Rust cache linking...\e[0m"
            rpmbuild -bp *.spec \
              --define "_topdir $GITHUB_WORKSPACE/rpmbuild" \
              --define "_sourcedir $RPM_SOURCES"

            ACTUAL_CARGO_DIR=$(find $GITHUB_WORKSPACE/rpmbuild/BUILD -type d -name "cargo-home" | head -n 1)
            if [ -n "$ACTUAL_CARGO_DIR" ]; then
              echo "Found cargo-home at $ACTUAL_CARGO_DIR, linking to cache..."
              rm -rf "$ACTUAL_CARGO_DIR"
              ln -s "$STABLE_CARGO_CACHE" "$ACTUAL_CARGO_DIR"
            fi
          fi

          # 5. Final Build Execution
          echo -e "\e[1;32m🚀 Starting Final RPM Build...\e[0m"
          rpmbuild -ba *.spec \
            --define "_topdir $GITHUB_WORKSPACE/rpmbuild" \
            --define "_sourcedir $RPM_SOURCES"

          echo -e "\e[1;32m--- DEBUG START ---\e[0m"
          # Check sccache
          if [ -d "$SCCACHE_DIR" ]; then
              echo -e "\e[1;32m.sccache size: $(du -sh "$SCCACHE_DIR" | cut -f1)\e[0m"
              echo -e "\e[1;32m.sccache total items: $(find "$SCCACHE_DIR" -type f | wc -l)\e[0m"
          else
              echo -e "\e[1;33m.sccache: Not used for this build.\e[0m"
          fi

          # Check ccache
          if [ -d "$CCACHE_DIR" ]; then
              echo -e "\e[1;32m.ccache size: $(du -sh "$CCACHE_DIR" | cut -f1)\e[0m"
              echo -e "\e[1;32m.ccache total items: $(find "$CCACHE_DIR" -type f | wc -l)\e[0m"
          else
              echo -e "\e[1;33m.ccache: Not used for this build.\e[0m"
          fi

          # Check Cargo
          STABLE_CARGO="${{ github.workspace }}/.cargo_cache"
          if [ -d "$STABLE_CARGO" ]; then
              echo -e "\e[1;32m.cargo size: $(du -sh "$STABLE_CARGO" | cut -f1)\e[0m"
              echo -e "\e[1;32m.cargo total items: $(find "$STABLE_CARGO" -type f | wc -l)\e[0m"
          else
              echo -e "\e[1;33m.cargo: Not used for this build.\e[0m"
          fi
          echo -e "\e[1;32m--- DEBUG END ---\e[0m"

      - name: Save Cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            .ccache
            .sccache
            .cargo_cache
          key: ${{ runner.os }}-build-cache-${{ vars.APP }}-${{ github.sha }}

      - name: Show Performance Stats
        if: always()
        run: |
          echo -e "\e[1;36m📊 --- Compilation Performance Summary ---\e[0m"

          # Check sccache (Rust)
          if [ -d "${{ github.workspace }}/.sccache" ]; then
            echo -e "\e[1;32m🦀 Rust/sccache stats:\e[0m"
            sccache --show-stats
          else
            echo -e "\e[1;33m⚠️ sccache directory not found. Rust was likely not cached.\e[0m"
          fi

          echo ""

          # Check ccache (C/C++)
          if [ -d "${{ github.workspace }}/.ccache" ]; then
            echo -e "\e[1;32m🛠️ C/C++ / ccache stats:\e[0m"
            ccache -s
          else
            echo -e "\e[1;33m⚠️ ccache directory not found. C/C++ was likely not cached.\e[0m"
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.APP }}-fc${{ vars.VER }}-rpm
          path: |
            rpmbuild/RPMS/*/*.rpm
            !rpmbuild/RPMS/*/*-debuginfo-*.rpm
            !rpmbuild/RPMS/*/*-debugsource-*.rpm
