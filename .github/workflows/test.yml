---
name: Test RPM Build

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - "apps/**/*.spec"
  pull_request:
    branches:
      - dev
    paths:
      - "apps/**/*.spec"

jobs:
  check-version:
    runs-on: ubuntu-latest
    environment: Test
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    env:
      COLOR_INFO: "\e[1;36m"
      COLOR_SUCCESS: "\e[1;32m"
      COLOR_WARN: "\e[1;33m"
      COLOR_RESET: "\e[0m"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Check if Push is a Sync from Main
        id: sync-check
        run: |
          git fetch origin main

          if git merge-base --is-ancestor HEAD origin/main; then
            echo -e "${COLOR_WARN}==> [WARNING] This commit exists on main. Skipping RPM build for sync.${COLOR_RESET}"
            echo "is_sync=true" >> $GITHUB_OUTPUT
          else
            echo "is_sync=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify Spec Version
        id: check
        if: steps.sync-check.outputs.is_sync == 'false'
        run: |
          SPEC_FILE=$(find apps/${{ vars.APP }} -maxdepth 1 -name "${{ vars.APP }}.spec" | head -n 1)

          if [ -z "$SPEC_FILE" ]; then
            echo "::error::==> [ERROR] No spec file found in the repository!"
            echo "should_build=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          VERSION=$(grep -i "^Version:" "$SPEC_FILE" | awk '{print $2}' | xargs)
          echo "Detected version: $VERSION"

          if [ "$VERSION" = "0" ] || [ -z "$VERSION" ]; then
            echo -e "${COLOR_WARN}==> [WARNING] Version is a placeholder (0) or empty. Skipping build.${COLOR_RESET}"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo -e "${COLOR_SUCCESS}==> Version is valid ($VERSION). Proceeding to build.${COLOR_RESET}"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-version
    if:
      needs.check-version.outputs.should_build == 'true' && github.ref ==
      'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: Test
    env:
      COLOR_INFO: "\e[1;36m"
      COLOR_SUCCESS: "\e[1;32m"
      COLOR_WARN: "\e[1;33m"
      COLOR_RESET: "\e[0m"
    container:
      image: ghcr.io/infiniti151/flatpak2rpm-builder:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: false

      - name: Restore Cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            /github/home/.ccache
            /github/home/.sccache
            /github/home/.cargo_cache
          key: ${{ runner.os }}-build-cache-${{ vars.APP }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-cache-${{ vars.APP }}-

      - name: Execute RPM Build
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: "*"
        run: |
          APP_DIR="apps/${{ vars.APP }}"
          SPEC_FILE="${{ vars.APP }}.spec"

          RPM_SOURCES="$HOME/rpmbuild/SOURCES"
          mkdir -p "$RPM_SOURCES" /github/home/.ccache /github/home/.sccache /github/home/.cargo_cache

          cd "$APP_DIR"

          echo -e "${COLOR_WARN}📝 Linting the spec file...${COLOR_RESET}"
          rpmlint -s "$SPEC_FILE" || {
              echo "::error::==> [ERROR] rpmlint found issues in the spec file. Please review the warnings above."
              exit 1
          }

          echo -e "${COLOR_WARN}📥 Downloading sources...${COLOR_RESET}"
          spectool -g -C "$RPM_SOURCES" "$SPEC_FILE"

          # 1. Base topdir/sourcedir layout configuration
          echo "_topdir /github/home/rpmbuild" > ~/.rpmmacros
          echo "_sourcedir /github/home/rpmbuild/SOURCES" >> ~/.rpmmacros

          # 2. Rust / Cargo Logic
          if grep -qiE "rust|cargo" "$SPEC_FILE"; then
            echo -e "${COLOR_INFO}🦀 Rust detected. Enabling sccache...${COLOR_RESET}"
            export SCCACHE_DIR="/github/home/.sccache"
            export RUSTC_WRAPPER="sccache"
            sccache --start-server

            export CARGO_HOME="/github/home/.cargo_cache"

            echo -e "${COLOR_WARN}📦 Preparing source for Rust cache linking...${COLOR_RESET}"
            rpmbuild -bp *.spec

            ACTUAL_CARGO_DIR=$(find /github/home/rpmbuild/BUILD -type d -name "cargo-home" | head -n 1)

            if [ -n "$ACTUAL_CARGO_DIR" ]; then
              echo -e "${COLOR_INFO}==> Linking RPM cargo-home to persistent cache...${COLOR_RESET}"
              rm -rf "$ACTUAL_CARGO_DIR"
              ln -sfn "$CARGO_HOME" "$ACTUAL_CARGO_DIR"
            fi
          fi

          # 3. C/C++ Detection and Build Execution
          echo -e "${COLOR_SUCCESS}🚀 Starting Final RPM Build...${COLOR_RESET}"

          if grep -qiE "gcc|gcc-c\+\+|clang|clang\+\+" "$SPEC_FILE"; then
            echo -e "${COLOR_INFO}🛠️ C/C++ Compiler detected. Injecting ccache variables...${COLOR_RESET}"

            export CCACHE_DIR="/github/home/.ccache"
            export CC="ccache gcc"
            export CXX="ccache g++"

            rpmbuild -ba *.spec \
              --define "configure_options %{?_configure_options} -Dccache=true" \
              --define "__cc ccache gcc" \
              --define "__cxx ccache g++"
          else
            rpmbuild -ba *.spec
          fi

          [ -n "${RUSTC_WRAPPER:-}" ] && sccache --stop-server || true

          echo -e "${COLOR_WARN}🔓 Handing ownership back to GitHub Runner...${COLOR_RESET}"
          RUNNER_UID=$(stat -c '%u:%g' /github/home 2>/dev/null || echo "1001:1001")
          chown -R "$RUNNER_UID" /github/home/.ccache /github/home/.sccache /github/home/.cargo_cache || true

          echo "::group::Cache Folder Statistics"
          if grep -qiE "rust|cargo" "$SPEC_FILE"; then
              echo -e "${COLOR_SUCCESS}==> .sccache size: $(du -sh "/github/home/.sccache" | cut -f1)${COLOR_RESET}"
              echo -e "${COLOR_SUCCESS}==> .cargo size: $(du -sh "/github/home/.cargo_cache" | cut -f1)${COLOR_RESET}"
          fi

          if grep -qiE "gcc|gcc-c\+\+|clang|clang\+\+" "$SPEC_FILE"; then
              echo -e "${COLOR_SUCCESS}==> .ccache size: $(du -sh "/github/home/.ccache" | cut -f1)${COLOR_RESET}"
          fi
          echo "::endgroup::"

      - name: Locate Built GXml Binaries
        run: |
          find $HOME/rpmbuild/BUILD -name "libgxml-0.20.so*"

      - name: Save Cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            /github/home/.ccache
            /github/home/.sccache
            /github/home/.cargo_cache
          key: ${{ runner.os }}-build-cache-${{ vars.APP }}-${{ github.sha }}

      - name: Show Cache Stats
        if: always()
        working-directory: apps/${{ vars.APP }}
        run: |
          SPEC_FILE="${{ vars.APP }}.spec"
          echo -e "${COLOR_INFO}📊 --- Cache Performance Statistics ---${COLOR_RESET}"

          export CCACHE_DIR="${{ github.workspace }}/.ccache"
          export SCCACHE_DIR="${{ github.workspace }}/.sccache"

          # Check sccache (Rust)
          if grep -qiE "rust|cargo" "$SPEC_FILE"; then
            echo -e "${COLOR_SUCCESS}🦀 Rust/sccache stats:${COLOR_RESET}"
            sccache --show-stats
          fi

          echo ""

          # Check ccache (C/C++)
          if grep -qiE "gcc|gcc-c\+\+|clang|clang\+\+" "$SPEC_FILE"; then
            echo -e "${COLOR_SUCCESS}🛠️ C/C++ / ccache stats:${COLOR_RESET}"
            ccache -s
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ vars.APP }}-fc${{ vars.VER }}-rpm
          path: |
            /github/home/rpmbuild/RPMS/*/*.rpm
            !/github/home/rpmbuild/RPMS/*/*-debuginfo-*.rpm
            !/github/home/rpmbuild/RPMS/*/*-debugsource-*.rpm
