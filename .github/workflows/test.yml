---
name: Test RPM Build

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - "apps/**/*.spec"
  pull_request:
    branches:
      - dev
    paths:
      - "apps/**/*.spec"

jobs:
  check-version:
    runs-on: ubuntu-latest
    environment: Test
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Verify Spec Version
        id: check
        run: |
          SPEC_FILE=$(find apps/${{ vars.APP }} -maxdepth 1 -name "${{ vars.APP }}.spec" | head -n 1)

          if [ -z "$SPEC_FILE" ]; then
            echo -e "\e[1;31m [ERROR] No .spec file found in the repository!\e[0m"
            echo "should_build=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          VERSION=$(grep -i "^Version:" "$SPEC_FILE" | awk '{print $2}' | xargs)
          echo "Detected version: $VERSION"

          if [ "$VERSION" = "0.0.0" ] || [ -z "$VERSION" ]; then
            echo -e "\e[1;33m [WARNING] Version is a placeholder (0.0.0) or empty. Skipping build.\e[0m"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo -e "\e[1;32mVersion is valid ($VERSION). Proceeding to build.\e[0m"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-version
    if:
      needs.check-version.outputs.should_build == 'true' && github.ref ==
      'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: Test
    container:
      image: ghcr.io/infiniti151/flatpak2rpm-builder:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Unified Cache (Rust, C, and Tools)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "fedora-cache-${{ vars.APP }}"
          cache-on-failure: "true"
          cache-targets: "true"
          add-rust-environment-hash-key: "false"
          cmd-format: "true ; # {0}"
          cache-directories: |
            .sccache
            .ccache
            .cargo_cache

      - name: Start sccache
        run: sccache --start-server

      - name: Execute RPM Build
        run: |
          SPEC_FILE="apps/${{ vars.APP }}/${{ vars.APP }}.spec"

          # 1. GCC / G++ Logic
          if grep -qiE "gcc|gcc-c\+\+" "$SPEC_FILE"; then
            echo "🛠️ GCC detected. Enabling CC/CXX wrappers..."
            export CCACHE_DIR="${{ github.workspace }}/.ccache"
            mkdir -p "$CCACHE_DIR"
            export CC="ccache gcc"
            export CXX="ccache g++"
          fi

          # 2. Clang / Clang++ Logic
          if grep -qiE "clang|clang\+\+" "$SPEC_FILE"; then
            echo "🪄 Clang detected. Setting Clang wrappers..."
            export CCACHE_DIR="${{ github.workspace }}/.ccache"
            mkdir -p "$CCACHE_DIR"
            export CC="ccache clang"
            export CXX="ccache clang++"
          fi

          # 3. Rust / Cargo Logic
          if grep -qiE "rust|cargo" "$SPEC_FILE"; then
            echo "🦀 Rust detected. Enabling sccache and deep-linking cargo-home..."
            export SCCACHE_DIR="${{ github.workspace }}/.sccache"
            export RUSTC_WRAPPER="sccache"
            mkdir -p "$SCCACHE_DIR"
            sccache --start-server

            # Deep-link logic for the messy RPM build path
            STABLE_CARGO_CACHE="${{ github.workspace }}/.cargo_cache"
            mkdir -p "$STABLE_CARGO_CACHE"

            rpmbuild -bp *.spec --define "_topdir $GITHUB_WORKSPACE/rpmbuild"

            ACTUAL_CARGO_DIR=$(find $GITHUB_WORKSPACE/rpmbuild/BUILD -type d -path "*/redhat-linux-build/cargo-home" | head -n 1)
            if [ -n "$ACTUAL_CARGO_DIR" ]; then
              rm -rf "$ACTUAL_CARGO_DIR"
              ln -s "$STABLE_CARGO_CACHE" "$ACTUAL_CARGO_DIR"
            fi
          fi

          # Final Build Execution
          cd "apps/${{ vars.APP }}"
          spectool -g *.spec
          rpmbuild -ba *.spec \
            --define "_topdir $GITHUB_WORKSPACE/rpmbuild" \
            --define "_sourcedir $(pwd)"

          echo "--- DEBUG START ---"
          # Check sccache
          if [ -d "$SCCACHE_DIR" ]; then
              echo ".sccache size: $(du -sh "$SCCACHE_DIR" | cut -f1)"
              echo ".sccache total items: $(find "$SCCACHE_DIR" -type f | wc -l)"
          else
              echo ".sccache: Not used for this build."
          fi

          # Check ccache
          if [ -d "$CCACHE_DIR" ]; then
              echo ".ccache size: $(du -sh "$CCACHE_DIR" | cut -f1)"
              echo ".ccache total items: $(find "$CCACHE_DIR" -type f | wc -l)"
          else
              echo ".ccache: Not used for this build."
          fi

          # Check Cargo
          STABLE_CARGO="${{ github.workspace }}/.cargo_cache"
          if [ -d "$STABLE_CARGO" ]; then
              echo ".cargo size: $(du -sh "$STABLE_CARGO" | cut -f1)"
              echo ".cargo total items: $(find "$STABLE_CARGO" -type f | wc -l)"
          else
              echo ".cargo: Not used for this build."
          fi
          echo "--- DEBUG END ---"
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: "*"

      - name: Show Performance Stats
        if: always()
        run: |
          sccache --show-stats
          ccache -s

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.APP }}-fc${{ vars.VER }}-rpm
          path: |
            rpmbuild/RPMS/*/*.rpm
            !rpmbuild/RPMS/*/*-debuginfo-*.rpm
            !rpmbuild/RPMS/*/*-debugsource-*.rpm
