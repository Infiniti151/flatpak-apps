---
name: Docker Image Builder

on:
  push:
    branches: ["dev"]
    paths:
      - "Dockerfile"
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dockerfile: ${{ steps.diff.outputs.dockerfile }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect Dockerfile change
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # schedule / workflow_dispatch: always build
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "dockerfile=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Old tip may be gone after a force push; try to fetch it
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || git fetch origin "$BEFORE" 2>/dev/null || true

          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            if git diff --quiet "$BEFORE" HEAD -- Dockerfile; then
              echo "dockerfile=false" >> "$GITHUB_OUTPUT"
            else
              echo "dockerfile=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "dockerfile=true" >> "$GITHUB_OUTPUT"   # can't compare: build anyway
          fi

  build-and-push:
    needs: changes
    if: needs.changes.outputs.dockerfile == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Image Name
        id: prep
        run: |
          REPO_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=${{ env.REGISTRY }}/${REPO_LOWER}/flatpak2rpm-builder" >> $GITHUB_OUTPUT

      - name: Build and Push Builder Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.prep.outputs.image_name }}:latest
            ${{ steps.prep.outputs.image_name }}:${{ github.sha }}
          build-args: |
            FEDORA_VER=${{ vars.VER }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
